name: Deploy StoreFlow to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project
        run: |
          npm ci --ignore-scripts
          node scripts/validate.mjs
          node scripts/test-storage.mjs
          node scripts/test-planning.mjs

      - name: Package public app files
        run: |
          mkdir -p dist
          cp index.html manifest.webmanifest sw.js .nojekyll dist/
          cp -R src assets dist/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
